services:
  db:
    image: postgres:16
    container_name: pladDB
    restart: unless-stopped
    environment:
      POSTGRES_DB: dbtest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pladdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dbtest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pladdb_data:
