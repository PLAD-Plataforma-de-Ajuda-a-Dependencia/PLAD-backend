# production (the Docker image activates it): see docs/deploy.md
# No defaults on purpose: an unset variable stops the app at startup, like JWT_SECRET in application.properties.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# live meeting room: no default for any of them, the URL included (it must be the wss:// address of the real project)
livekit.url=${LIVEKIT_URL}
livekit.api-key=${LIVEKIT_API_KEY}
livekit.api-secret=${LIVEKIT_API_SECRET}
meeting.identity-secret=${MEETING_IDENTITY_SECRET}

# API docs closed (already the default; explicit here so a stray env var cannot open them by accident)
springdoc.api-docs.enabled=false

# devtools is left out of the repackaged jar; this is a second guard in case it is ever on the classpath
spring.devtools.restart.enabled=false
