spring.application.name=pladbackend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dbtest}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.jackson.property-naming-strategy=SNAKE_CASE

jwt.secret=${JWT_SECRET:your-super-long-random-secret-key-that-should-be-at-least-32-characters-long-change-this}
jwt.expiration-ms=86400000
